name: Editor screenshots
on:
  workflow_dispatch:
  push:
    paths: ['tools/editor-harness/**','axes.js']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          mkdir out
          python3 - <<'P'
          import wave,struct,math
          w=wave.open('tools/editor-harness/t.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(22050)
          for i in range(22050*9):
              t=i/22050;k=int(t*25);r=((k*2654435761)%1000)/1000.0
              env=abs(math.sin(math.pi*t*3.3))*(0.25+0.75*r)
              if int(t*1.2)%4==3: env*=0.05
              w.writeframes(struct.pack('<h',int(14000*env*math.sin(2*math.pi*(180+60*r)*t))))
          w.close()
          P
          npm i playwright --no-save && npx playwright install --with-deps chromium
          node tools/editor-harness/shot.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: shots, path: out}
      - name: Push screenshots to editor-shots branch
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b editor-shots
          git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m "shots ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" editor-shots
