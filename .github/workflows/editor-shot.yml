name: Editor screenshots
on:
  workflow_dispatch:
  push:
    paths: ['tools/editor-harness/**','axes.js']
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          mkdir out
          python3 - <<'P'
          import wave,struct,math
          w=wave.open('tools/editor-harness/t.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(22050)
          for i in range(22050*9):
              t=i/22050;env=0.9 if int(t*3)%2==0 else 0.15
              w.writeframes(struct.pack('<h',int(12000*env*math.sin(2*math.pi*220*t))))
          w.close()
          P
          npm i playwright --no-save && npx playwright install --with-deps chromium
          node tools/editor-harness/shot.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: shots, path: out}
