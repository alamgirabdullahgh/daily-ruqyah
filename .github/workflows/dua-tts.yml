name: Dua audio (edge-tts bn-BD)
on:
  workflow_dispatch:
  push:
    paths:
      - 'dua/duas.json'
      - '.github/workflows/dua-tts.yml'
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts
      - name: Generate dua clips (edge-tts -> ffmpeg atempo, 22.05kHz mono 48k mp3)
        run: |
          python3 - <<'PY'
          import json, asyncio, subprocess, os
          import edge_tts
          cfg = json.load(open('dua/duas.json', encoding='utf-8'))
          tempo = cfg.get('tempo', 1.2)
          async def one(k, text):
              raw = f'/tmp/{k}.raw.mp3'
              for i in range(4):
                  try:
                      await edge_tts.Communicate(text, cfg['voice']).save(raw)
                      break
                  except Exception as e:
                      print('retry', k, e); await asyncio.sleep(3)
              else:
                  raise SystemExit('failed ' + k)
              subprocess.check_call(['ffmpeg', '-v', 'error', '-y', '-i', raw, '-ac', '1',
                  '-af', f'atempo={tempo}', '-ar', '22050', '-c:a', 'libmp3lame', '-b:a', '48k', f'dua/{k}.mp3'])
              print(k, os.path.getsize(f'dua/{k}.mp3'), 'bytes')
          async def main():
              for k, t in cfg['clips'].items():
                  await one(k, t)
          asyncio.run(main())
          PY
          ls -l dua
      - name: Commit clips
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dua/*.mp3
          git diff --cached --quiet || git commit -m "dua: edge-tts অডিও তৈরি (bn-BD, x1.20) [skip ci]"
          git push
