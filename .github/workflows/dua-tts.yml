name: Dua audio (Gemini TTS, Charon)
on:
  workflow_dispatch:
  push:
    paths:
      - 'dua/duas.json'
      - '.github/workflows/dua-tts.yml'
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate dua clips (Gemini TTS -> ffmpeg atempo, 22.05kHz mono mp3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, base64, subprocess, urllib.request, urllib.error
          cfg = json.load(open('dua/duas.json', encoding='utf-8'))
          tempo = cfg.get('tempo', 1.2)
          voice = cfg.get('voice', 'Charon')
          style = cfg.get('style', '')
          models = cfg.get('models', ['gemini-2.5-pro-preview-tts', 'gemini-2.5-flash-preview-tts'])
          key = os.environ['GEMINI_API_KEY']
          def call(model, text):
              body = {"contents": [{"parts": [{"text": (style + "\n" + text) if style else text}]}],
                      "generationConfig": {"responseModalities": ["AUDIO"],
                        "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": voice}}}}}
              req = urllib.request.Request(
                  f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                  data=json.dumps(body).encode(), method="POST",
                  headers={"Content-Type": "application/json", "x-goog-api-key": key})
              with urllib.request.urlopen(req, timeout=180) as r:
                  j = json.load(r)
              return base64.b64decode(j["candidates"][0]["content"]["parts"][0]["inlineData"]["data"])
          def gen(k, text):
              for model in models:
                  for i in range(4):
                      try:
                          pcm = call(model, text)
                          print(k, 'ok', model, len(pcm), 'bytes pcm'); return pcm
                      except urllib.error.HTTPError as e:
                          print('retry', k, model, e.code, e.read()[:200].decode('utf-8', 'ignore'))
                          time.sleep(8 if e.code == 429 else 3)
                      except Exception as e:
                          print('retry', k, model, repr(e)[:200]); time.sleep(3)
              raise SystemExit('failed ' + k)
          for k, t in cfg['clips'].items():
              raw = f'/tmp/{k}.pcm'
              open(raw, 'wb').write(gen(k, t))
              subprocess.check_call(['ffmpeg', '-v', 'error', '-y', '-f', 's16le', '-ar', '24000', '-ac', '1', '-i', raw,
                  '-af', f'atempo={tempo}', '-ar', '22050', '-c:a', 'libmp3lame', '-b:a', '64k', f'dua/{k}.mp3'])
              print(k, os.path.getsize(f'dua/{k}.mp3'), 'bytes mp3')
              time.sleep(4)
          PY
          ls -l dua
      - name: Commit clips
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dua/*.mp3
          git diff --cached --quiet || git commit -m "dua: Gemini TTS (Charon) অডিও [skip ci]"
          git pull --rebase -q || true
          git push
