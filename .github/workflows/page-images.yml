name: Page images (temporary)

# শুধু page-images-work branch-এ push হলে চলে; main-এ কিছু বদলায় না
on:
  push:
    branches: [page-images-work]
    paths: ['.github/workflows/page-images.yml']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install gdown pymupdf
      - name: Download and render pages
        run: |
          mkdir -p pdf pages/chalan pages/jadu
          gdown "1iTDPT7UX2w7BuWKiepKF4ImyysadeSeD" -O pdf/chalan.pdf
          gdown "1Vh0za7DT9jc78Q3TJe0jNYQBtjMva9pk" -O pdf/jadu.pdf
          python3 - <<'PY'
          import fitz
          for b in ("chalan", "jadu"):
              d = fitz.open(f"pdf/{b}.pdf")
              if d.needs_pass:
                  d.authenticate("")
              print(b, "pages:", len(d))
              for i, pg in enumerate(d, 1):
                  pg.get_pixmap(dpi=130).save(f"pages/{b}/p-{i:03d}.jpg", jpg_quality=65)
          PY
          du -sh pages/*
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add pages
          git commit -m "Temporary: scan page images for proofreading"
          git push
